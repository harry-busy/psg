<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review QR Kit</title>
<style>
:root{--emerald:#1B4D3E;--seaglass:#7EBFA3;--seaglass-l:#A8D4C2;--cream:#EAF2EE;--ink:#0A1F17}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Calibri,sans-serif;background:var(--cream);color:var(--ink)}
header{background:linear-gradient(135deg,var(--emerald),#0D3326);color:#fff;padding:14px 22px}h1{font-size:20px}
main{max-width:980px;margin:0 auto;padding:18px;display:grid;grid-template-columns:320px 1fr;gap:18px}
@media(max-width:820px){main{grid-template-columns:1fr}}
.panel{background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 10px rgba(8,26,16,.08)}
.panel h2{font-size:13px;color:var(--emerald);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;border-bottom:2px solid var(--cream);padding-bottom:6px}
label{font-size:12px;font-weight:600;display:block;margin:9px 0 3px}
input,select{width:100%;padding:8px;border:1px solid #b8d4c8;border-radius:8px;font-size:13px;background:#f8fdfa}
.btn{background:var(--emerald);color:#fff;border:none;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer;width:100%;margin-top:10px;font-size:14px}
#cv{max-width:100%;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
#stage{display:flex;flex-direction:column;align-items:center;gap:10px}
.hint{font-size:11px;color:#4d7264;margin-top:8px}
</style>
</head>
<body>
<header><h1>⭐ Review QR Kit</h1></header>
<main>
<div class="panel">
  <h2>Details</h2>
  <label>Google review link *</label><input id="url" placeholder="https://g.page/r/…/review">
  <label>Brand name</label><input id="brand" value="PSG Gold">
  <label>Tagline</label><input id="tag" value="Loved your jewellery? Bless us with a review!">
  <label>Format</label>
  <select id="fmt"><option value="poster">A4 poster (print at counter)</option><option value="card">Counter card 5×7"</option><option value="sticker">Square sticker 4×4"</option></select>
  <button class="btn" id="dl">⬇ Download PNG</button>
  <div class="hint">Get your link: Google Business Profile → “Ask for reviews” → copy link. Works for Justdial/any link too.</div>
</div>
<div class="panel" id="stage"><h2 style="align-self:flex-start">Preview</h2><canvas id="cv"></canvas></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
const $=id=>document.getElementById(id);const cv=$("cv"),ctx=cv.getContext("2d");
const holder=document.createElement("div");holder.style.display="none";document.body.appendChild(holder);
let qrImg=null;
function makeQR(cb){holder.innerHTML="";const u=$("url").value.trim()||"https://google.com";
new QRCode(holder,{text:u,width:512,height:512,correctLevel:QRCode.CorrectLevel.M});
setTimeout(()=>{const c=holder.querySelector("canvas");qrImg=c;cb()},60)}
function draw(){const f=$("fmt").value;
const dims={poster:[1240,1754],card:[1050,1470],sticker:[1200,1200]}[f];
cv.width=dims[0];cv.height=dims[1];const W=cv.width,H=cv.height;
ctx.fillStyle="#EAF2EE";ctx.fillRect(0,0,W,H);
ctx.fillStyle="#1B4D3E";ctx.fillRect(0,0,W,H*0.015);ctx.fillRect(0,H-H*0.015,W,H*0.015);
ctx.textAlign="center";
ctx.fillStyle="#0A1F17";ctx.font=`700 ${W*0.06}px Georgia`;ctx.fillText(($("brand").value||"Your Brand").toUpperCase(),W/2,H*0.12);
ctx.font=`${W*0.055}px Segoe UI`;ctx.fillText("⭐⭐⭐⭐⭐",W/2,H*0.19);
ctx.fillStyle="#1B4D3E";ctx.font=`600 ${W*0.033}px Segoe UI`;
wrap($("tag").value||"",W*0.8).forEach((l,i)=>ctx.fillText(l,W/2,H*0.25+i*W*0.045));
if(qrImg){const q=Math.min(W,H)*0.42;const qx=(W-q)/2,qy=H*0.33;
ctx.fillStyle="#fff";round(qx-20,qy-20,q+40,q+40,20);ctx.fill();ctx.strokeStyle="#7EBFA3";ctx.lineWidth=4;round(qx-20,qy-20,q+40,q+40,20);ctx.stroke();
ctx.drawImage(qrImg,qx,qy,q,q)}
ctx.fillStyle="#0A1F17";ctx.font=`600 ${W*0.03}px Segoe UI`;ctx.fillText("Scan with your phone camera",W/2,H*0.83);
ctx.fillStyle="#4d7264";ctx.font=`${W*0.024}px Segoe UI`;ctx.fillText("It takes 30 seconds — and means the world to our family business 🙏",W/2,H*0.88);
}
function wrap(t,maxW){ctx.font=`600 ${cv.width*0.033}px Segoe UI`;const words=t.split(" "),lines=[];let line="";
words.forEach(w=>{if(ctx.measureText(line+" "+w).width>maxW&&line){lines.push(line);line=w}else line=line?line+" "+w:w});if(line)lines.push(line);return lines}
function round(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function refresh(){makeQR(draw)}
["url","brand","tag","fmt"].forEach(id=>$(id).oninput=$(id).onchange=refresh);
$("dl").onclick=()=>{const a=document.createElement("a");a.download="review-qr-"+$("fmt").value+".png";a.href=cv.toDataURL("image/png");a.click()};
refresh();
</script>
</body>
</html>
