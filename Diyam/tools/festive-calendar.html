<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Festive Campaign Calendar — Jewellery Marketing</title>
<style>
:root{--emerald:#1B4D3E;--seaglass:#7EBFA3;--seaglass-l:#A8D4C2;--cream:#EAF2EE;--ink:#0A1F17}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Calibri,sans-serif;background:var(--cream);color:var(--ink)}
header{background:linear-gradient(135deg,var(--emerald),#0D3326);color:#fff;padding:14px 22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
h1{font-size:20px}
main{max-width:1000px;margin:0 auto;padding:18px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
select,.btn{padding:8px 14px;border-radius:8px;border:1px solid #b8d4c8;font-size:13px;background:#fff}
.btn{background:var(--emerald);color:#fff;border:none;font-weight:600;cursor:pointer}
.fest{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(8,26,16,.07);border-left:5px solid var(--seaglass)}
.fest.major{border-left-color:var(--emerald);background:linear-gradient(90deg,#E8F6EE,#fff)}
.fest h3{font-size:16px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
.fest h3 .date{color:var(--emerald);font-size:14px}
.fest .why{font-size:13px;color:#3d6255;margin:6px 0}
.fest .plan{font-size:12.5px;background:var(--cream);border-radius:8px;padding:8px 10px;margin-top:6px}
.fest .plan b{color:var(--emerald)}
.tag{font-size:10px;text-transform:uppercase;letter-spacing:.5px;background:var(--seaglass);color:#fff;border-radius:10px;padding:2px 8px;vertical-align:middle}
.tag.gold{background:var(--emerald)}
.approx{font-size:10px;color:#4d7264}
</style>
</head>
<body>
<header><h1>📅 Festive Campaign Calendar</h1><div><button class="btn" id="csv">⬇ CSV</button> <button class="btn" id="ics">⬇ Calendar (.ics)</button></div></header>
<main>
<div class="bar">
  <select id="yr"><option>2026</option><option>2027</option></select>
  <select id="imp"><option value="all">All festivals</option><option value="major">Gold-major only</option></select>
  <span style="font-size:12px;color:#8a7f6d">Each festival shows a ready T-minus campaign plan. Dates marked ≈ follow the lunar calendar — verify near the date.</span>
</div>
<div id="list"></div>
</main>
<script>
const $=id=>document.getElementById(id);
// [name, 2026 date, 2027 date, approx?, major?, why it matters for jewellers, [3 post ideas]]
const F=[
["Makar Sankranti / Pongal","2026-01-14","2027-01-15",0,0,"South-Indian new-harvest gifting; gold coins & light jewellery move well.",["Coin & light-jewellery gift guide reel","'New beginnings' offer post","Festive till decor + team greeting story"]],
["Valentine's Day","2026-02-14","2027-02-14",0,0,"Couples gifting — pendants, rings, bracelets at accessible prices.",["'Say it in gold' pendant reel","Couple-story UGC contest","DM-to-order Valentine's catalog broadcast"]],
["Ugadi / Gudi Padwa","2026-03-19","2027-04-08",0,1,"Karnataka new year — auspicious gold buying day in your home market.",["Ugadi wishes + new-collection teaser","'Start the year with gold' offer","Traditional styling reel in Kannada"]],
["Akshaya Tritiya","2026-04-21","2027-05-08",0,1,"THE biggest gold-buying day of the year — plan 3 weeks ahead.",["Countdown series (T-14/T-7/T-2)","Pre-booking offer + free insured delivery","Live gold-rate + muhurat-timing posts"]],
["Mother's Day","2026-05-10","2027-05-09",0,0,"Emotional gifting — mangalsutra, earrings, 'for amma' angle.",["'For Amma' storytelling reel","Mother-daughter matching sets","Customer mother-story UGC"]],
["Varamahalakshmi","2026-08-21","2027-08-13",1,1,"Karnataka's Lakshmi festival — strong traditional jewellery demand.",["Lakshmi-pooja jewellery guide","Temple-jewellery collection showcase","Festive booking broadcast to VIP list"]],
["Raksha Bandhan","2026-08-28","2027-08-17",1,0,"Sibling gifting — bracelets, chains, silver rakhi.",["Silver rakhi + bracelet catalog","'Gift her gold this Rakhi' reel","Brother-sister offer bundle"]],
["Onam","2026-08-26","2027-09-14",1,0,"Kerala customers & diaspora — traditional gold demand.",["Kasavu + gold styling reel","Onam wishes + light-jewellery offers","NRI shipping highlight post"]],
["Navratri / Dussehra","2026-10-11","2027-09-30",0,1,"9-day festive window; Vijayadashami is an auspicious buying day.",["9 days × 9 styles reel series","Dussehra muhurat buying post","Garba-ready jewellery edits"]],
["Karva Chauth","2026-10-29","2027-10-18",1,0,"North-Indian gifting moment for husbands → wives.",["Gifting guide for husbands","Mangalsutra & bangle showcase","Pre-order broadcast"]],
["Dhanteras","2026-11-06","2027-10-26",1,1,"Second-biggest gold day — wealth-buying tradition; queue management needed!",["T-10 countdown + pre-booking","Coins/bars + lightweight catalog","Extended-hours + live rate updates"]],
["Diwali / Lakshmi Puja","2026-11-08","2027-10-28",0,1,"Peak festive gifting; follow Dhanteras momentum through the week.",["Family-gifting lookbook","Diwali dhamaka offer reel","Thank-you + review request post-festival"]],
["Wedding Season (Nov–Feb)","2026-11-15","2027-11-15",1,1,"Bridal sets = biggest tickets; nurture brides 3–6 months ahead.",["Bridal lookbook series","Real-bride testimonial reels","Bridal appointment booking campaign"]],
["Christmas & New Year","2026-12-25","2027-12-25",0,0,"Year-end gifting + NRI visits home.",["Year-end gift guide","NRI 'back home' shopping post","New-year new-gold teaser"]],
];
function rows(){const y=$("yr").value,imp=$("imp").value;
return F.map(f=>({name:f[0],date:y==="2026"?f[1]:f[2],approx:f[3],major:f[4],why:f[5],ideas:f[6]}))
.filter(f=>imp==="all"||f.major).sort((a,b)=>a.date.localeCompare(b.date))}
function fdate(d){return new Date(d+"T00:00").toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short",year:"numeric"})}
function minus(d,n){const x=new Date(d+"T00:00");x.setDate(x.getDate()-n);return x.toLocaleDateString("en-IN",{day:"numeric",month:"short"})}
function render(){$("list").innerHTML=rows().map(f=>`
<div class="fest ${f.major?"major":""}">
<h3><span>${f.name} ${f.major?'<span class="tag gold">gold-major</span>':""}</span><span class="date">${fdate(f.date)} ${f.approx?'<span class="approx">≈ verify</span>':""}</span></h3>
<div class="why">${f.why}</div>
<div class="plan"><b>Campaign plan:</b> Teasers from <b>${minus(f.date,14)}</b> · main push <b>${minus(f.date,7)}</b> · final reminder <b>${minus(f.date,2)}</b> · thank-you/review ask day after.<br>
<b>Post ideas:</b> ${f.ideas.map((i,n)=>`${n+1}) ${i}`).join("  ")}</div>
</div>`).join("")}
$("yr").onchange=$("imp").onchange=render;
$("csv").onclick=()=>{const y=$("yr").value;
const csv=["Festival,Date,Major,Teaser start,Main push,Reminder,Idea 1,Idea 2,Idea 3"].concat(rows().map(f=>[f.name,f.date,f.major?"Yes":"No",minus(f.date,14),minus(f.date,7),minus(f.date,2),...f.ideas].map(x=>`"${x}"`).join(","))).join("\n");
const a=document.createElement("a");a.download=`jewellery-festive-calendar-${y}.csv`;a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.click()};
$("ics").onclick=()=>{const y=$("yr").value;
let ics="BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//Jewellery Festive Calendar//EN\n";
rows().forEach(f=>{const d=f.date.replace(/-/g,"");
[[0,f.name+" — festival day"],[14,f.name+" — start teasers"],[7,f.name+" — main campaign push"],[2,f.name+" — final reminder"]].forEach(([n,t])=>{
const x=new Date(f.date+"T00:00");x.setDate(x.getDate()-n);const ds=x.toISOString().slice(0,10).replace(/-/g,"");
ics+=`BEGIN:VEVENT\nDTSTART;VALUE=DATE:${ds}\nSUMMARY:${t}\nDESCRIPTION:${f.ideas.join(" | ")}\nEND:VEVENT\n`})});
ics+="END:VCALENDAR";
const a=document.createElement("a");a.download=`festive-campaigns-${y}.ics`;a.href=URL.createObjectURL(new Blob([ics],{type:"text/calendar"}));a.click()};
render();
</script>
</body>
</html>
